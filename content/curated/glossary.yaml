- term: jod
  definition: Jodtabletter brukes bare etter råd fra myndighetene ved atomberedskap.
  aliases: [kaliumjodid]
  synonyms: [jodtablett, jodtabletter, jod-tablett, atomulykke, atomberedskap, radioaktivt nedfall, nukleær hendelse]
  sourceIds: [src-jodtabletter-i-sivilforsvaret, src-atomberedskap-i-norge-og-sivilforsvarets-rolle]
- term: dose
  definition: Stråledose registreres med metode, tid, sted og usikkerhet.
  synonyms: [dosimeter, doserate, dosekontroll, radiac, stråling, oppholdstid]
  sourceIds: [src-bestemmelse-radiacmaletjeneste-del-i]
- term: rens
  definition: Grov-/finrens ved CBRN-hendelser skal skille ren og uren side.
  synonyms: [sanering, dekontaminering, grovrens, finrens, ren side, uren side, MRE, CBRN]
  sourceIds: [src-veileder-for-sivilforsvarets-renseenheter-cbrn, src-samvirke-pa-forurenset-skadested-cbrne-sps41]
- term: MFE
  definition: Mobil forsterkningsenhet som kan støtte distrikter ved større hendelser.
  synonyms: [mobil forsterkningsenhet, forsterkningsenhet, nasjonal støtte, støtteanmodning]
  sourceIds: [src-grunnopplaering-mfe-10-mannskap]
- term: RADIAC
  definition: Radiologisk måletjeneste for måling, dosekontroll og rapportering.
  synonyms: [radiacmåling, stråling, dose, dosimeter, doserate]
  sourceIds: [src-bestemmelse-radiacmaletjeneste-del-i]
- term: samband
  definition: Planlagt samband beskriver radiobruk, kallesignal, kanaler/talegrupper og alternative kontaktveier.
  synonyms: [radio, nødnett, kallesignal, sambandstest, kommunikasjonsplan, sambandsplan]
  sourceIds: [src-kommunikasjons-og-sambandsdiagram, src-5-punktsordre]
- term: samleplass
  definition: Samleplass brukes som felles oppmøte-, mottaks- eller samlepunktsbegrep etter oppdragets plan.
  aliases: [oppmøtested, frammøtested]
  synonyms: [depot, staging, mottakspunkt, samlepunkt]
  sourceIds: [src-kursplan-grunnkurs-fig10, src-5-punktsordre]
- term: ordre
  definition: 5-punktsordre strukturerer situasjon, oppdrag, plan/utførelse, administrasjon/forsyning og ledelse/samband.
  aliases: [5-punktsordre]
  synonyms: [fempunktsordre, oppdrag, ordrepunkt, situasjon, utførelse, ledelse]
  sourceIds: [src-5-punktsordre]
- term: KO
  definition: Kommandoplass/KO og IL-KO brukes som søkeord for ledelsesplass i innsatsområdet.
  aliases: [IL-KO, ilko, ko]
  synonyms: [kommandoplass, innsatsleders KO, innsatsleders IL-KO]
  sourceIds: [src-5-punktsordre, src-operativt-konsept-for-sivilforsvaret]
- term: innsatsleder
  definition: Innsatsleder/IL er et samvirkebegrep som ofte brukes sammen med politi, brann, helse og stab.
  aliases: [IL]
  synonyms: [innsatsledelse, politi, brann, helse, stab]
  sourceIds: [src-5-punktsordre, src-enhetlig-ledelsessystem-els]
- term: beredskapsvakt
  definition: Beredskapsvakt/vakthavende dekker vaktfunksjon, mottak av varsler og første oppfølging.
  aliases: [vakt]
  synonyms: [vakthavende, varselmottak]
  sourceIds: [src-opplaeringsplan-for-beredskapsvakt]
- term: pumpe
  definition: Pumpe og lensepumpe brukes ved flom, vannforsyning, slangeutlegg og vannskade.
  aliases: [lensepumpe]
  synonyms: [flom, vannforsyning, slangeutlegg, vannskade]
  sourceIds: [src-eksempler-pa-utlegg-fra-pumpe, src-operativt-konsept-for-sivilforsvaret]
- term: slangeutlegg
  definition: Slangeutlegg er planlagt slangevei fra vannkilde/pumpe til leveringspunkt, der vannføring, trykktap, trykkforsterkning og seriekjøring vurderes under ledelse.
  aliases: [slangevei]
  synonyms: [vannkilde, pumpeplass, vannforsyning, vannføring, trykktap, trykkforsterkning, seriekjøring, parallelle utlegg]
  sourceIds: [src-eksempler-pa-utlegg-fra-pumpe, src-kursplan-grunnkurs-fig10]
- term: skadde
  definition: Søketermer for skadde og førstehjelp peker til livreddende tiltak; ikke registrer pasientdata i appen.
  aliases: [skadet]
  synonyms: [samleplass, førstehjelp, "113", livreddende førstehjelp, pasient]
  sourceIds: [src-tiltakskort-04-alvorlig-ulykke-dod-og-mental-forstehjelp, src-livreddende-tiltak-ved-rn-hendelse]
- term: psykososial
  definition: Psykososial oppfølging dekker defuse/defusing, debrief, EFOK, kollegastøtte og psykisk førstehjelp.
  aliases: [EFOK]
  synonyms: [defuse, defusing, debrief, kollegastøtte, psykisk førstehjelp]
  sourceIds: [src-psykososial-oppfolging-og-kollegastotte, src-tiltakskort-psykologisk-forstehjelp]
- term: MBK
  definition: Materiellberedskapskontroll/MBK dekker materiellkontroll, etterkontroll, klargjøring og service etter bruk.
  aliases: [materiellberedskap]
  synonyms: [materiellkontroll, etterkontroll, klargjøring, karantene, service, vask]
  sourceIds: [src-sjekkliste-mobil-forsterkningsenhet-mfe, src-opplaering-materiellansvarlig-fig]
- term: tilfluktsrom
  definition: Beskyttelsestiltak der bare offentlig/godkjent informasjon skal brukes i MVP.
  synonyms: [sivile beskyttelsestiltak, offentlig tilfluktsrom]
  sourceIds: [src-operativt-konsept-for-sivilforsvaret]
- term: FIG10
  definition: Grunnkurs for FIG/FIGP-mannskap.
  synonyms: [grunnkurs, mannskap, opplæring]
  sourceIds: [src-kursplan-grunnkurs-fig10]
- term: IPP
  definition: Initialt prioriteringspunkt som brukes til å rette første innsats mot relevante opplysninger, linjer eller punkter.
  synonyms: [initialt prioriteringspunkt, prioriteringspunkt]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: LKP
  definition: Siste kjente punkt i en savnetsak, brukt som del av beslutningsgrunnlaget for videre søk.
  synonyms: [last known point, siste kjente punkt]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: POI
  definition: Punkt av interesse som bør vurderes eller undersøkes i søket.
  synonyms: [point of interest, interessepunkt]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: POA
  definition: Point of arrival, et ankomstpunkt som inngår i søksplanleggingen.
  synonyms: [point of arrival, ankomstpunkt]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: POD
  definition: Probability of detection, en vurdering av sannsynligheten for at søksmetoden oppdager et relevant funn.
  synonyms: [probability of detection, deteksjonssannsynlighet]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: POS
  definition: Point of safety, et avtalt sikkerhetspunkt eller område for laget.
  synonyms: [point of safety, sikkerhetspunkt]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: ledeline
  definition: En tydelig linje i terrenget som kan brukes til å strukturere søk, men som ikke alene dekker området mellom linjer.
  synonyms: [ledelinjesøk, linjesøk, ledelinje-søk]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: sykkelhjulmodellen
  definition: En arbeidsmodell der planlegging, gjennomføring, observasjon og ny vurdering gjentas i en løpende søkssyklus.
  synonyms: [sykkelhjul, sykkelhjulmodell]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: FAKS
  definition: En lokal støtte for å holde oversikt over søksinformasjon, oppgaver og status.
  synonyms: [faks, søksstøtte]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: SEAO
  definition: En søksfase eller arbeidsform som skal vurderes og gjennomføres etter lokal faglig prosess.
  synonyms: [seao, søksfase]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
- term: søksfaser
  definition: Faser i en søksaksjon som styrer prioritering, metode, kvalitetssikring og videre beslutninger.
  synonyms: [søkefase, søksfase, søksforløp]
  sourceIds: [src-nasjonal-veileder-sok-etter-savnet-person-pa-land-2026]
