- id: sok-metodevalg
  question: Hvordan velges søksmetode?
  answer: Søksledelsen velger metode etter tilgjengelig informasjon, terreng, fase, ressurser og risiko. Beredskapsboka gir bare lokal beslutningsstøtte.
